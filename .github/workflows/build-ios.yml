# ============================================
# MyFavor iOS - 在 GitHub Actions 编译生成 IPA
# 用法:
#   1. 手动触发:Actions → "Build iOS IPA" → Run workflow
#   2. 完成后在 Artifacts 下载 MyFavor-unsigned.ipa
#   3. 用 Xcode / Sideloadly / AltStore 装到 iPhone
# ============================================

name: Build iOS IPA

on:
  workflow_dispatch:    # 手动触发(自动触发被禁,iOS build 慢)
  push:
    branches: [main]
    paths:
      - 'MyFavor/**'
      - '.github/workflows/build-ios.yml'

env:
  SCHEME: MyFavor
  WORKSPACE: MyFavor.xcworkspace
  PROJECT: MyFavor.xcodeproj
  CONFIGURATION: Release
  EXPORT_METHOD: development    # 改成 ad-hoc 装到多设备,app-store 上架

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14    # macOS 14,带 Xcode 15
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      
      - name: 显示 Xcode 版本
        run: xcodebuild -version
      
      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            MyFavor/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-${{ hashFiles('**/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: 装 CocoaPods(如需要)
        run: |
          if [ ! -f MyFavor/Podfile ]; then
            echo "❌ 没有 Podfile,跳过(纯 SwiftUI 项目不用 CocoaPods)"
          else
            gem install cocoapods --no-document
            cd MyFavor && pod install
          fi
      
      - name: 列出 schemes
        run: xcodebuild -list -project ${{ env.PROJECT }}

      - name: 编译并生成 IPA
        run: |
          # PROJECT env 是 'MyFavor.xcodeproj'(在仓库根)
          # 所以从仓库根跑,不去 cd 子目录
          mkdir -p build

          # Archive
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyFavor.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
          
          # 检查 archive
          ls -la build/MyFavor.xcarchive/Products/Applications/ 2>/dev/null || echo "Archive 异常"
      
      - name: 创建 ExportOptions.plist
        run: |
          # build 在仓库根(刚才从根跑 archive)
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
      
      - name: 手动打包成 IPA(跳过 xcodebuild -exportArchive,它需要 Team)
        run: |
          set -e
          # archive 完成后,MyFavor.app 在:
          #   build/MyFavor.xcarchive/Products/Applications/MyFavor.app
          # 我们手动在 build/ 目录创建 Payload/,然后 zip 成 IPA

          cd build
          echo "--- 验证 .app 存在 ---"
          ls -la MyFavor.xcarchive/Products/Applications/MyFavor.app/ | head -10

          echo "--- 创建 Payload 结构 ---"
          mkdir -p Payload
          cp -r MyFavor.xcarchive/Products/Applications/MyFavor.app Payload/

          echo "--- 打包成 IPA ---"
          # 排除 .DS_Store 等 macOS 垃圾文件
          zip -r MyFavor-unsigned.ipa Payload/ -x "*.DS_Store" -q

          echo "--- 验证 IPA ---"
          ls -la MyFavor-unsigned.ipa
          file MyFavor-unsigned.ipa || true
          # 验证:unzip 列出 Payload
          unzip -l MyFavor-unsigned.ipa | head -10

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFavor-unsigned
          # 明确路径,不用 glob(更可靠)
          path: MyFavor/build/MyFavor-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

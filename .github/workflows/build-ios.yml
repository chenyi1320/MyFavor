# ============================================
# MyFavor iOS - 在 GitHub Actions 编译生成 IPA
# 用法:
#   1. 手动触发:Actions → "Build iOS IPA" → Run workflow
#   2. 完成后在 Artifacts 下载 MyFavor-unsigned.ipa
#   3. 用 Xcode / Sideloadly / AltStore 装到 iPhone
# ============================================

name: Build iOS IPA

on:
  workflow_dispatch:    # 手动触发(自动触发被禁,iOS build 慢)
  push:
    branches: [main]
    paths:
      - 'MyFavor/**'
      - '.github/workflows/build-ios.yml'

env:
  SCHEME: MyFavor
  WORKSPACE: MyFavor.xcworkspace
  PROJECT: MyFavor.xcodeproj
  CONFIGURATION: Release
  EXPORT_METHOD: development    # 改成 ad-hoc 装到多设备,app-store 上架

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14    # macOS 14,带 Xcode 15
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      
      - name: 显示 Xcode 版本
        run: xcodebuild -version
      
      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            MyFavor/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-${{ hashFiles('**/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: 装 CocoaPods(如需要)
        run: |
          if [ ! -f MyFavor/Podfile ]; then
            echo "❌ 没有 Podfile,跳过(纯 SwiftUI 项目不用 CocoaPods)"
          else
            gem install cocoapods --no-document
            cd MyFavor && pod install
          fi
      
      - name: 列出 schemes
        run: xcodebuild -list -project MyFavor/${{ env.PROJECT }}
      
      - name: 编译并生成 IPA
        run: |
          cd MyFavor
          mkdir -p build
          
          # Archive
          xcodebuild \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyFavor.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
          
          # 检查 archive
          ls -la build/MyFavor.xcarchive/Products/Applications/ 2>/dev/null || echo "Archive 异常"
      
      - name: 创建 ExportOptions.plist
        run: |
          cat > MyFavor/build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>YOUR_APPLE_TEAM_ID</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
      
      - name: 导出 IPA
        run: |
          cd MyFavor/build
          xcodebuild -exportArchive \
            -archivePath MyFavor.xcarchive \
            -exportPath . \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tail -20
          
          # 列出产物
          ls -la *.ipa 2>/dev/null || echo "❌ IPA 未生成"
      
      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFavor-unsigned
          path: MyFavor/build/*.ipa
          if-no-files-found: error
          retention-days: 30

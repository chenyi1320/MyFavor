# ============================================
# MyFavor Backend - 自动部署到阿里云 ECS
# 策略:CI 不 build,服务器自己 build(避免 prisma 版本问题)
# ============================================

name: Deploy Backend to Aliyun ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy-aliyun-mysql.sh'
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/myfavor/MyFavor

jobs:
  # ============================================
  # Job 1: 轻量级检查(不 build,只查文件)
  # ============================================
  validate:
    name: Quick File Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 检查关键文件存在
        run: |
          echo "检查项目结构..."
          test -f backend/package.json && echo "✅ package.json"
          test -f backend/prisma/schema.prisma && echo "✅ schema.prisma"
          test -f backend/src/server.ts && echo "✅ server.ts"
          test -f backend/tsconfig.json && echo "✅ tsconfig.json"
          echo "✅ 文件结构完整"
      
      - name: 验证 package.json 是合法 JSON
        run: node -e "console.log('✅ package.json 合法,prisma 版本:', require('./backend/package.json').dependencies.prisma)"

  # ============================================
  # Job 2: 部署(服务器自己 build)
  # ============================================
  deploy:
    name: Deploy to Aliyun ECS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: SSH 连接到阿里云 ECS 并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=========================================="
            echo "🚀 MyFavor Auto Deploy"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            # 1. 拉最新代码(带重试,规避 ECS 出口网络抖动导致的 GnuTLS recv error)
            echo "📥 [1/6] 拉取最新代码..."
            cd ${{ env.DEPLOY_PATH }}
            FETCH_OK=0
            for i in 1 2 3 4 5; do
              if git fetch origin 2>&1; then
                FETCH_OK=1
                break
              fi
              echo "⚠️  git fetch 第 $i 次失败, $((i*3))s 后重试..."
              sleep $((i*3))
            done
            if [ "$FETCH_OK" != "1" ]; then
              echo "❌ 5 次重试后仍无法连接 GitHub,放弃本次部署"
              exit 1
            fi
            git reset --hard origin/main
            
            # 2. 装依赖(用国内镜像,绕开 ECS 上可能存在的 ~/.npmrc 干扰)
            echo "📦 [2/6] 装依赖(国内镜像)..."
            cd backend
            # ⚠️ 关键:替换 package-lock.json 里被污染的 resolved URL
            # (ECS 上之前用 r.npmjs.one/r.npmjs.org 装的,这些域名 DNS 解析失败)
            # 锁文件里的 resolved 字段优先级最高,--registry 参数盖不住
            if [ -f package-lock.json ]; then
              sed -i 's|http://r\.npmjs\.[a-z]*|https://registry.npmmirror.com|g' package-lock.json
              echo "🔧 已修复 package-lock.json 里的坏 registry URL"
            fi
            # 强制用国内 npm 镜像(registry.npmmirror.com,npmmirror 新域名)
            # --registry 直接传命令行参数,优先级最高,覆盖任何 .npmrc
            npm install --no-audit --registry=https://registry.npmmirror.com

            # 3. 同步数据库 schema
            echo "🗄️ [3/6] 同步数据库 schema..."
            # 优先用 migrate(更安全,需要历史 migration 文件);无迁移时 fallback 到 db push
            if [ -d prisma/migrations ]; then
              ./node_modules/.bin/prisma migrate deploy 2>&1 | tail -10
            else
              # ⚠️ 首次部署可接受 db push;后续必须有 migration 文件
              ./node_modules/.bin/prisma db push --skip-generate 2>&1 | tail -10
            fi

            # 4. 编译(用本地 tsc)
            echo "🔨 [4/6] 编译 TypeScript..."
            ./node_modules/.bin/tsc


            # 5. 重启
            echo "🔄 [5/6] 重启后端..."
            pm2 delete myfavor-api 2>/dev/null || true
            pm2 start dist/server.js --name myfavor-api
            pm2 save
            
            # 健康检查
            sleep 2
            echo "🏥 健康检查..."
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ 部署成功!服务健康"
              pm2 status
            else
              echo "❌ 服务不健康!"
              pm2 logs myfavor-api --lines 20 --nostream
              exit 1
            fi
            
            echo "=========================================="
            echo "🎉 部署完成"
            echo "=========================================="

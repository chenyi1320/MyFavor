# ============================================
# MyFavor Backend - 自动部署到阿里云 ECS
# 策略:CI 不 build,服务器自己 build(避免 prisma 版本问题)
# ============================================

name: Deploy Backend to Aliyun ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy-aliyun-mysql.sh'
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/myfavor/MyFavor

jobs:
  # ============================================
  # Job 1: 轻量级检查(不 build,只查文件)
  # ============================================
  validate:
    name: Quick File Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 检查关键文件存在
        run: |
          echo "检查项目结构..."
          test -f backend/package.json && echo "✅ package.json"
          test -f backend/prisma/schema.prisma && echo "✅ schema.prisma"
          test -f backend/src/server.ts && echo "✅ server.ts"
          test -f backend/tsconfig.json && echo "✅ tsconfig.json"
          echo "✅ 文件结构完整"
      
      - name: 验证 package.json 是合法 JSON
        run: node -e "console.log('✅ package.json 合法,prisma 版本:', require('./backend/package.json').dependencies.prisma)"

  # ============================================
  # Job 2: 部署(服务器自己 build)
  # ============================================
  deploy:
    name: Deploy to Aliyun ECS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: SSH 连接到阿里云 ECS 并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=========================================="
            echo "🚀 MyFavor Auto Deploy"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            # 1. 拉最新代码
            echo "📥 [1/6] 拉取最新代码..."
            cd ${{ env.DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/main
            
            # 2. 装依赖(用国内镜像)
            echo "📦 [2/6] 装依赖(国内镜像)..."
            cd backend
            npm config set registry https://registry.npmmirror.com
            npm install --omit=dev --no-audit
            
            # 3. 显式安装 prisma 5.x(因为是 dependencies)
            echo "📌 [3/6] 确保 prisma 5.x 已装..."
            npm install prisma@5.18.0 --omit=dev --no-audit 2>/dev/null || true
            
            # 4. 同步数据库 schema
            echo "🗄️ [4/6] 同步数据库 schema..."
            npx prisma db push --skip-generate --accept-data-loss 2>&1 | tail -5 || echo "⚠️ db push 跳过"
            
            # 5. 编译
            echo "🔨 [5/6] 编译 TypeScript..."
            npx tsc
            
            # 6. 重启
            echo "🔄 [6/6] 重启后端..."
            pm2 delete myfavor-api 2>/dev/null || true
            pm2 start dist/server.js --name myfavor-api
            pm2 save
            
            # 健康检查
            sleep 2
            echo "🏥 健康检查..."
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ 部署成功!服务健康"
              pm2 status
            else
              echo "❌ 服务不健康!"
              pm2 logs myfavor-api --lines 20 --nostream
              exit 1
            fi
            
            echo "=========================================="
            echo "🎉 部署完成"
            echo "=========================================="

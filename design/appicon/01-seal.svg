<?xml version="1.0" encoding="UTF-8"?>
<!--
  MyFavor AppIcon 设计 1 —— 印章风
  核心:墨绿底 + 琥珀色圆形印章 + 礼 字
  寓意:传统印章的"郑重"感,适合中文市场
  配色:#1A3D2E(深墨绿) / #2C5F4F(墨绿) / #F5E6D3(琥珀)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#2C5F4F"/>
      <stop offset="60%" stop-color="#1A3D2E"/>
      <stop offset="100%" stop-color="#0F2A1F"/>
    </radialGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEFD8"/>
      <stop offset="100%" stop-color="#E8D4B5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景:墨绿径向渐变 -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- 装饰外圈:极淡的琥珀光环 -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#F5E6D3" stroke-width="2" opacity="0.12"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#F5E6D3" stroke-width="1" opacity="0.08"/>

  <!-- 主体印章圆 -->
  <g filter="url(#softShadow)">
    <circle cx="512" cy="512" r="320" fill="url(#sealGrad)"/>
  </g>

  <!-- 印章双线边框(传统印章风格) -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#1A3D2E" stroke-width="6"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#1A3D2E" stroke-width="3"/>

  <!-- 礼 字 -->
  <text x="512" y="512"
        font-family="'STKaiti', 'KaiTi', 'Kaiti SC', 'STZhongsong', 'Songti SC', 'Noto Serif CJK SC', 'PingFang SC', serif"
        font-size="380"
        font-weight="900"
        fill="#1A3D2E"
        text-anchor="middle"
        dominant-baseline="central">礼</text>

  <!-- 印章底部小方框 + 自 字(传统"私印"风格点缀) -->
  <rect x="472" y="780" width="80" height="50" fill="none" stroke="#1A3D2E" stroke-width="2.5"/>
  <text x="512" y="808"
        font-family="'STKaiti', 'KaiTi', 'Songti SC', 'Noto Serif CJK SC', serif"
        font-size="28"
        font-weight="700"
        fill="#1A3D2E"
        text-anchor="middle"
        dominant-baseline="central">自</text>
</svg>

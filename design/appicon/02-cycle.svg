<?xml version="1.0" encoding="UTF-8"?>
<!--
  MyFavor AppIcon 设计 2 —— 循环风
  核心:礼字居中 + 周围双箭头循环(礼尚往来)
  寓意:礼的"流"——送出/收回的循环
  配色:#1A3D2E(深墨绿) / #F5E6D3(琥珀) / #F2B53C(金色)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2C5F4F"/>
      <stop offset="100%" stop-color="#0F2A1F"/>
    </radialGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C5F4F"/>
      <stop offset="100%" stop-color="#1A3D2E"/>
    </linearGradient>
  </defs>

  <!-- 背景:墨绿径向渐变 -->
  <rect width="1024" height="1024" fill="url(#bgGrad2)"/>

  <!-- 上半圆弧 + 箭头(琥珀色)—— 表示"收礼" -->
  <g>
    <path d="M 200 512
             A 312 312 0 0 1 824 512"
          fill="none"
          stroke="#F5E6D3"
          stroke-width="56"
          stroke-linecap="round"/>
    <!-- 右侧箭头(指向右下) -->
    <polygon points="824,512 740,460 740,564" fill="#F5E6D3"/>
  </g>

  <!-- 下半圆弧 + 箭头(金色)—— 表示"回礼" -->
  <g>
    <path d="M 824 512
             A 312 312 0 0 1 200 512"
          fill="none"
          stroke="#F2B53C"
          stroke-width="56"
          stroke-linecap="round"/>
    <!-- 左侧箭头(指向左上) -->
    <polygon points="200,512 284,460 284,564" fill="#F2B53C"/>
  </g>

  <!-- 中央"礼"字小印章(深墨绿) -->
  <circle cx="512" cy="512" r="140" fill="url(#inkGrad)" stroke="#F5E6D3" stroke-width="4"/>
  <text x="512" y="512"
        font-family="'STKaiti', 'KaiTi', 'Kaiti SC', 'STZhongsong', 'Songti SC', 'Noto Serif CJK SC', 'PingFang SC', serif"
        font-size="160"
        font-weight="900"
        fill="#F5E6D3"
        text-anchor="middle"
        dominant-baseline="central">礼</text>
</svg>

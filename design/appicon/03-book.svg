<?xml version="1.0" encoding="UTF-8"?>
<!--
  MyFavor AppIcon 设计 3 —— 账本风
  核心:账本形状 + "礼"字封面 + 金色丝带
  寓意:最直观的"账本"语义
  配色:#1A3D2E(深墨绿) / #2C5F4F(墨绿) / #F5E6D3(琥珀) / #F2B53C(金色)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2C5F4F"/>
      <stop offset="100%" stop-color="#0F2A1F"/>
    </radialGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBEFD8"/>
      <stop offset="100%" stop-color="#E8D4B5"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3D2E"/>
      <stop offset="100%" stop-color="#0F2A1F"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#D49B1F"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bgGrad3)"/>

  <!-- 账本整体(带阴影) -->
  <g filter="url(#bookShadow)">
    <!-- 书页右侧厚度提示 -->
    <rect x="285" y="232" width="455" height="560" rx="14" fill="#FBEFD8" opacity="0.4"/>
    <rect x="295" y="232" width="455" height="560" rx="14" fill="#E8D4B5" opacity="0.6"/>

    <!-- 主体书(琥珀色封面) -->
    <rect x="280" y="220" width="460" height="580" rx="16" fill="url(#bookCover)"/>

    <!-- 书脊(深墨绿) -->
    <rect x="280" y="220" width="55" height="580" fill="url(#spineGrad)"/>

    <!-- 书脊上的两条金色细线(传统线装书) -->
    <line x1="295" y1="270" x2="320" y2="270" stroke="#F2B53C" stroke-width="3"/>
    <line x1="295" y1="750" x2="320" y2="750" stroke="#F2B53C" stroke-width="3"/>

    <!-- 书签丝带(金色) -->
    <rect x="640" y="220" width="40" height="200" fill="url(#ribbonGrad)"/>
    <polygon points="640,420 660,440 680,420" fill="url(#ribbonGrad)"/>
  </g>

  <!-- "礼"字刻在书封上 -->
  <text x="540" y="510"
        font-family="'STKaiti', 'KaiTi', 'Kaiti SC', 'STZhongsong', 'Songti SC', 'Noto Serif CJK SC', 'PingFang SC', serif"
        font-size="320"
        font-weight="900"
        fill="#1A3D2E"
        text-anchor="middle"
        dominant-baseline="central">礼</text>

  <!-- 封面下方小字:MyFavor 英文 -->
  <text x="540" y="700"
        font-family="'Helvetica Neue', 'SF Pro Display', sans-serif"
        font-size="42"
        font-weight="600"
        fill="#1A3D2E"
        opacity="0.6"
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="6">MyFavor</text>
</svg>

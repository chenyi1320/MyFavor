# Render 基础设施即代码
# 用法:Render Dashboard → New → Blueprint → 选此文件
# 或在 Render 中连接 GitHub repo,它会自动识别 render.yaml

services:
  - type: web
    name: myfavor-api
    runtime: node
    plan: free                       # 免费层
    region: singapore                # 离国内最近的区域
    rootDir: backend                 # ⚠️ 关键:指向 backend 子目录
    branch: main
    healthCheckPath: /health
    autoDeploy: true                 # 推代码自动部署
    
    buildCommand: >-
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    
    startCommand: npm start
    
    envVars:
      # === 数据库(从 Neon 拷贝,见步骤 1)===
      - key: DATABASE_URL
        value: REPLACE_WITH_NEON_CONNECTION_STRING
      
      # === 服务配置 ===
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"                # Render 强制 10000
      
      # === Resend 邮件(填你的新 Key)===
      - key: RESEND_API_KEY
        value: REPLACE_WITH_YOUR_RESEND_KEY
      - key: RESEND_FROM_EMAIL
        value: "MyFavor <onboarding@resend.dev>"
      
      # === App 元信息 ===
      - key: APP_NAME
        value: MyFavor
      - key: APP_URL_SCHEME
        value: myfavor
      # APP_URL 在部署成功后自动填:https://myfavor-api.onrender.com
      
      # === JWT(用 generateValue 自动生成强密钥)===
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "30d"
